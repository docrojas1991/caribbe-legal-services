server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html code.html;

    # Habilitar compresión GZIP para mejorar el rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rutas para HTML (para que funcionen sin extensión si es necesario, o directamente)
    location / {
        try_files $uri $uri/ $uri.html /code.html /index.html;
    }

    # Caché estático para imágenes, CSS y JS
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Bloquear acceso a archivos ocultos (como .git)
    location ~ /\. {
        deny all;
    }
}
